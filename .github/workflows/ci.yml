name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  # Let the active run save its checked Lake cache. Only the newest pending
  # revision needs to run after it; newer pushes may replace that pending run.
  cancel-in-progress: false

jobs:
  tiny-core:
    name: Lean proofs and actual artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Bound concurrent Lean workers to fit the hosted runner's memory.
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Cache the pinned official Lean toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Nix's Elan patches the release executables for the pinned environment.
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain') }}
      - name: Restore native Lake builds
        id: lake
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Keep dependencies and project artifacts together so newly imported
          # mathlib modules and compiler artifact-certificate .olean products are
+          # retained too. Lake checks all freshness traces and actual input bytes.
          # This cache epoch excludes retired parser builds and old root modules.
          path: |
            .lake/packages
            packages/*/.lake/build
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'lean-toolchain', 'lake-manifest.json') }}-
      - name: Reuse pinned mathlib proofs without rebuilding
        run: |
          mkdir -p build
          nix develop .#verification --command bash -euo pipefail <<'SHELL'
          mapfile -t modules < <(rg --no-filename '^import Mathlib\.' packages --glob '*.lean' | sed 's/^import //' | sort -u)
          test "${#modules[@]}" -gt 0
          mapfile -t targets < <(printf 'mathlib/%s\n' "${modules[@]}")
          # A prior commit's native cache normally satisfies this immediately.
          # Fetch on a cold start or when new imports need more upstream proofs.
          if lake --no-build build "${targets[@]}" > build/ci-mathlib-cache.log 2>&1; then
            cat build/ci-mathlib-cache.log
          else
            lake exe cache get "${modules[@]}" 2>&1 | tee -a build/ci-mathlib-cache.log
            lake --no-build build "${targets[@]}" 2>&1 | tee -a build/ci-mathlib-cache.log
          fi
          SHELL
      - name: Check generic parser and language packages
        run: |
          mkdir -p build
          nix develop .#verification --command lake build check-parser check-modelica-parser check-galec-parser 2>&1 | tee build/ci-parser.log
      - name: Complete verification gate
        run: nix develop .#verification --command lake test 2>&1 | tee build/ci-verification.log
      - name: Save checked native Lake builds
        if: steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .lake/packages
            packages/*/.lake/build
          key: ${{ steps.lake.outputs.cache-primary-key }}
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-evidence
          path: |
            build/**/*.log
            build/**/*.txt
            build/Integrator.fmu
            build/Integrator.efmu
            build/tensor-c/*.c
            build/tensor-c/Check-*.lean
          if-no-files-found: warn
          retention-days: 14
